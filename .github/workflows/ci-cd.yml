
name: CI/CD Pipeline

on: push

jobs:
  carregar_backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sistemametodosageis
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Checar Java
        run: java -version

      - name: Compilar backend
        run: cd backend && ./mvnw package

  carregar_frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Conferir Node
        run: node -v

      - name: Compilar frontend
        working-directory: frontend
        run: npm ci && npm run build

  deploy:
    needs: [carregar_backend, carregar_frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Webhook deploy
        run: curl -H "Bearer: 2|0PfrEYtRsQkOMGot1oPGslJiAoiWJR9KKLsS71Ls041da773" https://computacao.fema.edu.br/api/v1/deploy?uuid=kows78zwu3oocgffxdod41ia&force=false  
