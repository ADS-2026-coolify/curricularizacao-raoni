name: compilar_aplicacao

on: push

jobs:
 carregar_backend:
   runs-on: ubuntu-latest

   services:
     postgres:
       image: postgres:18
       env:
         POSTGRES_USER: postgres
         POSTGRES_PASSWORD: postgres
         POSTGRES_DB: sistemametodosageis

       ports:
        - 5432:5432 #[porta runner: porta container]
       options: >-
         --health-cmd pg_isready
         --health-interval 10s
         --health-timeout 5s
         --health-retries 5   

   steps:
     - name: Baixar o código
       uses: actions/checkout@v4
 
     - name: instalar java 21
       uses: actions/setup-java@v4
       with:
         distribution: 'temurin'
         java-version: '21'

     - name: checar java
       run: java -version

     - name: compilar backend
       run: cd backend && ./mvnw package

 carregar_frontend:
    runs-on: ubuntu-latest
    steps:
      - name: baixar o código
        uses: actions/checkout@v4

      - name: instalar node 20
        uses: actions/setup-node@v4
        with:
           node-version: '20' # Informe a versão do Node desejada (20)
           cache: 'npm'
           cache-dependency-path: frontend/package-lock.json

      - name: conferir node
        run: node -v

      - name: compilar frontend
        working-directory: frontend
        run: npm ci && npm run build       