name: compilar_aplicacao

on: push

jobs:
 carregar_backend:
   runs-on: ubuntu-latest

   services:
     postgres:
       image: postgres:18
       env:
         POSTGRES_USER: postgres
         POSTGRES_PASSWORD: postgres
         POSTGRES_DB: sistemametodosageis

       ports:
        - 5432:5432 #[porta runner: porta container]
       options: >-
         --health-cmd pg_isready
         --health-interval 10s
         --health-timeout 5s
         --health-retries 5   

   steps:
     - name: Baixar o código
       uses: actions/checkout@v4
 
     - name: instalar java 21
       uses: actions/setup-java@v4
       with:
         distribution: 'temurin'
         java-version: '21'

     - name: checar java
       run: java -version

     - name: compilar backend
       run: cd backend && ./mvnw package
